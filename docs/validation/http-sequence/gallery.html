<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PortBridge HTTP断言与顺序联调</title><style>body{margin:0;background:#101618;color:#e3ecee;font:16px/1.6 system-ui}main{max-width:1440px;margin:auto;padding:28px}h1{font-size:26px}a{color:#85d9c3}select{padding:9px 12px;background:#20282b;color:inherit;border:1px solid #45565c;border-radius:7px;font:inherit}label{display:inline-block;margin:6px 16px 12px 0}figure{margin:14px 0;padding:16px;background:#181f22;border:1px solid #2b383d;border-radius:10px}img{display:block;max-width:100%;max-height:80vh;margin:auto;object-fit:contain}figcaption{margin-top:12px;color:#a8bec6}.controls{position:sticky;top:0;background:#101618;padding:8px 0}</style><main><h1>HTTP 响应断言与项目顺序联调</h1><p>http-sequence-1 原生Qt截图。断言从权威响应计算；顺序执行复用当前项目环境的登录token，整段占有HTTP活动资源。报告省略实际/预期值、请求/响应内容与凭据。</p><p><a href="../../http-sequence-guide.md">操作指南</a> · <a href="../../reviews/http-sequence.md">实施与验证</a> · <a href="final/result.json">测试回执</a> · <a href="package-receipt.json">包回执</a></p><div class="controls"><label>软件缩放 <select id="scale"><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select></label><label>界面 <select id="view"><option value="assertions-dark.png">响应断言</option><option value="sequence-selection-dark.png">请求选择与排序</option><option value="sequence-results-dark.png">实际联调结果</option><option value="project-light.png">项目 · 浅色</option><option value="extraction-dark.png">响应提取</option></select></label><a id="original" href="#" target="_blank">查看原图</a></div><figure><img id="picture" alt="HTTP顺序联调原生截图"><figcaption id="caption"></figcaption></figure><p>界面配置与截图准备不会自动通信；结果截图来自明确运行后的本地合成服务响应。软件缩放验证不代表物理多屏DPI或生产系统登录。</p></main><script>const scale=document.querySelector('#scale'),view=document.querySelector('#view'),picture=document.querySelector('#picture'),caption=document.querySelector('#caption'),original=document.querySelector('#original');function update(){const path=`final/native-${scale.value}/${view.value}`;picture.src=path;original.href=path;caption.textContent=`${view.selectedOptions[0].textContent} · 软件缩放 ${scale.selectedOptions[0].textContent}`;}scale.onchange=view.onchange=update;update();</script></html>
