<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PortBridge HTTP交互与项目设置</title><style>body{background:#11191b;color:#dce9e7;font:15px system-ui,"Microsoft YaHei",sans-serif;margin:0}main{max-width:1280px;margin:auto;padding:28px}h1{font-size:26px}p{line-height:1.8;color:#b2c5c3}nav{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}select{background:#203135;border:1px solid #425655;border-radius:5px;color:#e1eeec;padding:8px;font:inherit}img{display:block;max-width:100%;height:auto;border:1px solid #425655;border-radius:8px}a{color:#85dec4}</style><main><h1>HTTP项目、环境和请求</h1><p>项目收纳接口，环境配置服务地址，请求保存名称/方法/路径。HTTP创建入口不再要求重复填写地址。项目设置采用左侧分类、右侧内容和固定保存区，紧凑窗口中内容滚动。以下为真实Qt Windows截图，缩放是软件因子。</p><nav><label>界面 <select id="page"><option value="settings-@-0">当前环境</option><option value="settings-@-1">项目与变量</option><option value="settings-@-2">公共认证</option><option value="settings-@-3">生效变量</option><option value="settings-@-4">浏览器指纹</option><option value="basic-@">Basic认证</option><option value="compact-@-0">紧凑：当前环境</option><option value="compact-@-2">紧凑：公共认证</option><option value="compact-@-4">紧凑：浏览器指纹</option><option value="create-4-@">创建HTTP请求</option><option value="create-5-@">创建WebSocket连接</option></select></label><label>主题 <select id="theme"><option value="dark">深色</option><option value="light">浅色</option></select></label><label>软件缩放 <select id="scale"><option>1</option><option>1.25</option><option>1.5</option></select></label></nav><img id="image" src="final/native-1/settings-dark-0.png" alt="原生HTTP项目设置"><p><a href="../../reviews/http-interaction.md">实施与验证</a> · <a href="../../http-project-guide.md">使用指南</a></p></main><script>function show(){const page=document.getElementById('page').value,theme=document.getElementById('theme').value,scale=document.getElementById('scale').value;document.getElementById('image').src=`final/native-${scale}/${page.replace('@',theme)}.png`}document.querySelectorAll('select').forEach(element=>element.addEventListener('change',show));</script></html>
