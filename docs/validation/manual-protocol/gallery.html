<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PortBridge · HTTP / WebSocket 真实工作台</title>
<style>body{margin:0;background:#101719;color:#dce9e8;font:14px system-ui,"Microsoft YaHei UI",sans-serif}main{max-width:1480px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 10px}p{color:#9badae;line-height:1.7}a{color:#85dec4}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}label{display:flex;align-items:center;gap:8px}select{color:#dce9e8;background:#1c282b;border:1px solid #344446;border-radius:5px;padding:8px}figure{margin:0;border:1px solid #344446;background:#182225;border-radius:8px;overflow:hidden}img{display:block;width:100%;height:auto}figcaption{padding:13px;color:#aabebd}button{color:#101719;background:#85dec4;border:0;border-radius:5px;padding:9px;cursor:pointer}.notes{padding:15px 0}</style>
<main><h1>HTTP / WebSocket 手动调试工作台</h1><p>以下是运行真实本地 HTTP、WebSocket 服务后的 Windows 原生界面。HTTP 展示实际 401 响应和遮蔽结果；WebSocket 展示实际文本发送、服务端主动推送及完整消息。Qt 软件缩放记录与物理 Windows DPI 验证分别处理。</p>
<nav><label>协议<select id="protocol"><option value="http">HTTP 401 响应</option><option value="ws">WebSocket 消息</option></select></label><label>主题<select id="theme"><option value="dark">深色</option><option value="light">浅色</option></select></label><label>窗口<select id="size"><option value="desktop">桌面</option><option value="compact">紧凑 1024 × 768</option></select></label><label>Qt 软件缩放<select id="scale"><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select></label><button id="open">打开原图</button></nav>
<figure><img id="image" alt="PortBridge 原生 HTTP/WebSocket 工作台"><figcaption id="caption"></figcaption></figure><p class="notes">紧凑截图采用浅色主题。文件像素尺寸由实际图片读取；桌面窗口在较大软件缩放时可能受窗口管理器可用区域限制。原始结果由后端保留，画面与默认复制采用有界遮蔽预览。<a href="../../manual-protocol-guide.md">操作指南</a> · <a href="../../reviews/manual-protocol.md">实施与验证报告</a> · <a href="final/result.json">最终验证记录</a></p></main>
<script>
const ids=['protocol','theme','size','scale'];const controls=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));const image=document.getElementById('image'),caption=document.getElementById('caption');
function render(){const compact=controls.size.value==='compact';controls.theme.options[0].disabled=compact;if(compact)controls.theme.value='light';const prefix=controls.protocol.value==='http'?'http-401':'ws-messages';const filename=compact?(controls.protocol.value==='http'?'http-compact':'ws-compact')+'.png':prefix+'-'+controls.theme.value+'.png';image.src='final/native-'+controls.scale.value+'/'+filename;image.onload=()=>{caption.textContent=(controls.protocol.value==='http'?'实际 HTTP 401':'实际 WebSocket 消息')+' · '+(controls.theme.value==='dark'?'深色':'浅色')+' · Qt 软件缩放 '+(Number(controls.scale.value)*100)+'% · 文件像素 '+image.naturalWidth+' × '+image.naturalHeight;};image.onerror=()=>{caption.textContent='该图片文件缺失，请检查验证目录。';};}
ids.forEach(id=>controls[id].addEventListener('change',render));document.getElementById('open').addEventListener('click',()=>window.open(image.src,'_blank','noopener'));render();
</script></html>
