<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PortBridge HTTP 配置 · 原生界面</title>
<style>body{margin:0;background:#11191b;color:#dce9e7;font:15px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1240px;margin:auto;padding:28px}h1{font-size:26px;margin:0 0 12px}p{color:#b2c5c3;line-height:1.8}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,select{background:#203135;color:#e1eeec;border:1px solid #425655;border-radius:6px;padding:9px 14px;font:inherit}button[aria-pressed=true]{background:#85dec4;color:#10241e}img{display:block;max-width:100%;height:auto;margin:auto;border:1px solid #425655;border-radius:8px}figure{margin:0;background:#0d1416;padding:16px}figcaption{color:#a8bdb9;margin:12px 0}a{color:#85dec4}</style>
<main><h1>HTTP 项目、环境与认证配置</h1><p>下方为实际 Qt Windows 窗口截图。环境保存差异配置，项目提供共享定义，运行值单独显示；点击保存后统一应用草稿。缩放选项为 Qt 软件缩放，并非物理显示器组合验收。</p>
<nav aria-label="查看界面"><button data-tab="0" aria-pressed="true">当前环境</button><button data-tab="1" aria-pressed="false">项目变量</button><button data-tab="2" aria-pressed="false">公共认证</button><button data-tab="3" aria-pressed="false">生效变量</button><button data-tab="basic" aria-pressed="false">Basic 认证</button><button data-tab="project" aria-pressed="false">工作台</button><label>主题 <select id="theme"><option value="dark">深色</option><option value="light">浅色</option></select></label><label>软件缩放 <select id="scale"><option>1</option><option>1.25</option><option>1.5</option></select></label></nav>
<figure><img id="image" src="final/native-1/settings-dark-0.png" alt="原生当前环境配置窗口"><figcaption id="caption">当前环境：名称、服务地址与环境变量在同一页配置。</figcaption></figure><p><a href="../../http-project-guide.md">操作指南</a> · <a href="../../reviews/http-configuration.md">验证与交付报告</a></p></main>
<script>let tab='0';const descriptions={'0':'当前环境：名称、服务地址与环境变量在同一页配置。','1':'项目变量：所有环境共享默认定义，环境同名变量可以覆盖。','2':'公共认证：按认证方式显示字段，变量引用与脱敏请求头示意清楚。','3':'生效变量：显示来源和运行更新时间，敏感值遮蔽，清除操作保存后生效.',basic:'Basic：只显示用户名与密码字段，支持变量引用。',project:'工作台：项目设置和配置环境为明确入口。'};function show(){const theme=document.getElementById('theme').value,scale=document.getElementById('scale').value,file=tab==='basic'?`basic-${theme}`:tab==='project'?`project-${theme}`:`settings-${theme}-${tab}`;const image=document.getElementById('image');image.src=`final/native-${scale}/${file}.png`;image.alt=descriptions[tab];document.getElementById('caption').textContent=descriptions[tab]}document.querySelectorAll('button[data-tab]').forEach(button=>button.addEventListener('click',()=>{tab=button.dataset.tab;document.querySelectorAll('button[data-tab]').forEach(other=>other.setAttribute('aria-pressed',other===button?'true':'false'));show()}));document.getElementById('theme').addEventListener('change',show);document.getElementById('scale').addEventListener('change',show);</script></html>
