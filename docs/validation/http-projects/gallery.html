<main><h1>HTTP 项目工作台 · http-project-1</h1><p>原生Qt Widgets受控截图，支持深浅主题、变量、认证与响应提取。切换缩放比较软件100%／125%／150%的渲染；这些结果不代表物理多显示器验证。截图准备不发送通信，真实登录与请求字节由独立本地服务回归测试验证。</p><p><a href="../../http-project-guide.md">操作指南</a> · <a href="../../reviews/http-projects.md">实施审核</a> · <a href="final/result.json">构建/测试回执</a> · <a href="package-receipt.json">包回执</a></p>
<div class="controls"><label>软件缩放 <select id="scale"><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select></label><label>界面 <select id="view"><option value="project-dark.png">项目 · 深色</option><option value="project-light.png">项目 · 浅色</option><option value="extraction-dark.png">响应提取</option><option value="variables-dark.png">环境变量</option><option value="project-auth-dark.png">项目公共认证</option></select></label><a id="original" href="#" target="_blank">查看原图</a></div>
<figure><img id="picture" alt="HTTP项目工作台原生截图"><figcaption id="caption"></figcaption></figure><p>运行值仅在当前项目与环境生效，响应token和敏感值不进入项目文件。保存未解析模板，明确发送才展开变量与执行通信。项目认证Token与变量敏感值默认隐藏。</p></main>
<script>const scale=document.querySelector('#scale'),view=document.querySelector('#view'),picture=document.querySelector('#picture'),caption=document.querySelector('#caption'),original=document.querySelector('#original');function update(){const path=`final/native-${scale.value}/${view.value}`;picture.src=path;original.href=path;caption.textContent=`${view.selectedOptions[0].textContent} · 软件缩放 ${scale.selectedOptions[0].textContent} · 实际Qt截图`;}scale.onchange=view.onchange=update;update();</script></html>
