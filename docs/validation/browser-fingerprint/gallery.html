<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PortBridge 浏览器请求头配置</title><style>body{background:#11191b;color:#dce9e7;font:15px system-ui,"Microsoft YaHei",sans-serif;margin:0}main{max-width:1280px;margin:auto;padding:28px}h1{font-size:26px}p{line-height:1.8;color:#b2c5c3}nav{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}select{background:#203135;border:1px solid #425655;border-radius:5px;color:#e1eeec;padding:8px;font:inherit}img{display:block;max-width:100%;height:auto;border:1px solid #425655;border-radius:8px}a{color:#85dec4}</style><main><h1>环境中的浏览器请求头配置</h1><p>实际Qt Windows截图。随机生成后先预览，保存后固定用于当前环境；发送不重新随机。此功能只控制HTTP请求头，不修改TLS握手或网页JavaScript指纹。缩放为Qt软件因子。</p><nav><label>浏览器 <select id="browser"><option value="chrome">Chrome</option><option value="edge">Edge</option><option value="firefox">Firefox</option></select></label><label>主题 <select id="theme"><option value="dark">深色</option><option value="light">浅色</option></select></label><label>软件缩放 <select id="scale"><option>1</option><option>1.25</option><option>1.5</option></select></label></nav><img id="image" src="final/native-1/chrome-dark.png" alt="原生浏览器请求头配置"><p><a href="../../reviews/browser-fingerprint.md">实现与验证</a> · <a href="../../browser-fingerprint-guide.md">使用指南</a></p></main><script>function show(){const browser=document.getElementById('browser').value,theme=document.getElementById('theme').value,scale=document.getElementById('scale').value;document.getElementById('image').src=`final/native-${scale}/${browser}-${theme}.png`}document.querySelectorAll('select').forEach(element=>element.addEventListener('change',show));</script></html>
