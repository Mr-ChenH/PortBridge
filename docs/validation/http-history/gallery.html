<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PortBridge HTTP 请求记录</title><style>body{background:#11191b;color:#dce9e7;font:15px system-ui,"Microsoft YaHei",sans-serif;margin:0}main{max-width:1280px;margin:auto;padding:28px}h1{font-size:26px}p{line-height:1.8;color:#b2c5c3}nav{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}select{background:#203135;border:1px solid #425655;border-radius:5px;color:#e1eeec;padding:8px;font:inherit}img{display:block;max-width:100%;height:auto;border:1px solid #425655;border-radius:8px}a{color:#85dec4}</style><main><h1>一次 HTTP 请求，一条记录</h1><p>实际 Qt Windows 截图：请求中的记录在收到结果后更新为已响应；再次发送才增加下一条。非2xx保留真实响应码。以下缩放为Qt软件因子，不代表所有物理显示器组合验收。</p><nav><label>阶段 <select id="stage"><option value="pending">请求中 · 1条</option><option value="response">响应完成 · 仍1条</option><option value="non2xx">下一次401响应 · 共2条</option></select></label><label>主题 <select id="theme"><option value="dark">深色</option><option value="light">浅色</option></select></label><label>软件缩放 <select id="scale"><option>1</option><option>1.25</option><option>1.5</option></select></label></nav><img id="image" src="final/native-1/pending-dark.png" alt="原生HTTP请求记录"><p><a href="../../reviews/http-history.md">实现与验证</a> · <a href="../../manual-protocol-guide.md">使用指南</a></p></main><script>function show(){const stage=document.getElementById('stage').value,theme=document.getElementById('theme').value,scale=document.getElementById('scale').value;document.getElementById('image').src=`final/native-${scale}/${stage}-${theme}.png`}document.querySelectorAll('select').forEach(element=>element.addEventListener('change',show));</script></html>
