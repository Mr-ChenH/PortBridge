<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PortBridge · 新建连接</title><style>body{margin:0;background:#11191c;color:#dbe9e7;font:14px system-ui,"Microsoft YaHei UI",sans-serif}main{max-width:1100px;padding:30px;margin:auto}h1{font-size:26px}p{color:#9eb2b2;line-height:1.7}nav{display:flex;gap:16px;flex-wrap:wrap;margin:22px 0}select{padding:8px;background:#1d2b2e;color:#dbe9e7;border:1px solid #3c5053;border-radius:5px}figure{margin:0;display:grid;justify-items:center;background:#1a2528;border-radius:8px;padding:20px}img{max-width:100%;height:auto}a{color:#85dec4}figcaption{padding-top:14px;color:#9eb2b2}</style><main><h1>统一新建连接 · 六种类型</h1><p>真实Windows原生对话框，包含HTTP与WebSocket创建入口、深浅主题、卡片选中状态和协议地址。创建保存方案并打开工作台，网络动作仍需用户明确执行。</p><nav><label>类型 <select id="kind"><option value="4">HTTP</option><option value="5">WebSocket</option></select></label><label>主题 <select id="theme"><option value="dark">深色</option><option value="light">浅色</option></select></label><label>Qt软件缩放 <select id="scale"><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select></label></nav><figure><a id="original" target="_blank" rel="noopener"><img id="image" alt="真实新建连接对话框"></a><figcaption id="caption"></figcaption></figure><p><a href="../../reviews/connection-creation.md">实施报告</a> · <a href="final/result.json">验证记录</a>。图片来自真实本地服务旁的创建验证，创建期间服务端没有收到请求或握手。</p></main><script>const kind=document.getElementById('kind'),theme=document.getElementById('theme'),scale=document.getElementById('scale'),image=document.getElementById('image');function render(){const path='final/native-'+scale.value+'/create-'+kind.value+'-'+theme.value+'.png';image.src=path;document.getElementById('original').href=path;image.onload=()=>{document.getElementById('caption').textContent='Qt软件缩放 '+Number(scale.value)*100+'% · 图片像素 '+image.naturalWidth+' × '+image.naturalHeight;};}[kind,theme,scale].forEach(el=>el.addEventListener('change',render));render();</script></html>
