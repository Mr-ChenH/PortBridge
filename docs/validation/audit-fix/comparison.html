<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PortBridge · 审核修复对照</title><style>
:root{color-scheme:dark;font-family:Segoe UI,Microsoft YaHei UI,sans-serif;background:#101416;color:#e5edee}*{box-sizing:border-box}body{margin:0;padding:28px;max-width:2100px;margin-inline:auto}h1{font-size:26px;margin:0 0 10px}p{color:#a7b7bc;line-height:1.7;max-width:1150px}a{color:#85dec4}nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:24px 0 14px}select,button{background:#171c1f;color:#e5edee;border:1px solid #415258;border-radius:5px;padding:10px 14px;font:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#21352f;border-color:#85dec4}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.pair.stack{grid-template-columns:1fr;max-width:1440px;margin:auto}figure{margin:0;min-width:0;border:1px solid #2b3438;background:#171c1f}figcaption{padding:12px 16px;color:#a7b7bc;font-size:13px}figure img{width:100%;display:block}figure.dialog img{width:auto;max-width:100%;margin:0 auto}#note{padding:12px 16px;background:#21352f;border-left:3px solid #85dec4;max-width:none;color:#e5edee}.links{display:flex;gap:16px;flex-wrap:wrap;margin:18px 0}footer{border-top:1px solid #2b3438;margin-top:26px;padding-top:18px;font-size:13px;color:#a7b7bc}@media(max-width:800px){body{padding:16px}.pair{grid-template-columns:1fr}}
</style></head><body>
<h1>PortBridge · 审核修复对照</h1>
<p>左侧可选择设计原型或修复前版本，右侧为 audit-fix-1 原生界面。主窗口统一为 1440×1000，原生界面使用真实本机 UDP 数据和临时采集文件。点击图片查看原尺寸；原型中的示例设备和吞吐值是模拟内容，不作为数值对比依据。</p>
<div class="links"><a href="../../reviews/audit-fix-acceptance.md">修复与验收报告</a><a href="../../reviews/design-function-audit.md">原始审核</a><a href="coordinator-probes.txt">协调者独立复现回归</a></div>
<nav><label for="baseline">左侧</label><select id="baseline"><option value="design">设计原型</option><option value="native">修复前 ui-refinement-2</option></select><label for="view">页面</label><select id="view"><option value="udp">UDP 工作台 / 字节检查器</option><option value="tcp-client">TCP 客户端连接配置</option><option value="capture-settings">采集设置</option><option value="diagnostics">丢失诊断</option><option value="captures">采集文件</option><option value="commands">命令库</option><option value="command-dialog">命令编辑对话框</option><option value="profile-dialog">方案编辑对话框</option></select><button id="layout" type="button" aria-pressed="false">切换上下排列</button></nav>
<p id="note"></p><main class="pair" id="pair"><figure id="before-figure"><figcaption id="before-caption">设计原型 · 模拟内容</figcaption><a id="before-link" href="../design-audit/design-udp.png"><img id="before" src="../design-audit/design-udp.png" alt="设计原型"></a></figure><figure id="after-figure"><figcaption>修复后 · audit-fix-1 · 真实本机数据</figcaption><a id="after-link" href="native-udp.png"><img id="after" src="native-udp.png" alt="修复后的原生界面"></a></figure></main>
<footer>截图反映实际连接状态，不在产品内填入模拟速率或设备。原生对话框图只包含窗口内容；与设计整窗图不作面积比较。真实串口、双机 2.5G、持续磁盘负载和干净 Windows 验收仍需外部设备环境。</footer>
<script>
const notes={udp:'核对连接按钮位置、紧凑指标、显示格式位置，以及独立 HEX / 范围说明 / ASCII 分区。复制操作保留完整原始字节。','tcp-client':'目标地址和端口优先，本地地址随后；额外本地端口保留在高级设置。切换方案清空原方案的统计、字节检查器与错误。','capture-settings':'保存目录采用垂直标题，轮转/时长并列，容量估算独立强调；记录队列预算和真实空间查询仍可用。',diagnostics:'诊断使用紧凑分隔行；接收截断单独计数，序号缺失率使用已确认观察位置作为分母，未观测的数据保持未知。',captures:'显示实际协议、开始时间、时长、容量和元数据状态，提供行内操作；刷新异步扫描实际目录。',commands:'新增操作位于页头，每行提供载入、编辑、导出与删除。快捷命令保存格式、编码、换行和周期参数；载入不自动发送。','command-dialog':'字段垂直分组，正文有明确标签，按钮使用中文；HEX 隐藏不适用的编码选项，周期支持有限和持续模式。','profile-dialog':'方案对话框保留通信类型，用于新建/编辑；连接配置侧栏只显示协议标签。有效的旧方案编辑在新建前保留。'};
const select=document.querySelector('#view'),baseline=document.querySelector('#baseline');function update(){const key=select.value;const before='../design-audit/'+baseline.value+'-'+key+'.png',after='native-'+key+'.png';for(const [side,url] of [['before',before],['after',after]]){document.getElementById(side).src=url;document.getElementById(side+'-link').href=url;}document.querySelector('#before-caption').textContent=baseline.value==='design'?'设计原型 · 模拟内容':'修复前 · ui-refinement-2';document.querySelector('#before-figure').classList.toggle('dialog',key.endsWith('dialog')&&baseline.value==='native');document.querySelector('#after-figure').classList.toggle('dialog',key.endsWith('dialog'));document.querySelector('#note').textContent=notes[key];}select.addEventListener('change',update);baseline.addEventListener('change',update);document.querySelector('#layout').addEventListener('click',event=>{const stacked=document.querySelector('#pair').classList.toggle('stack');event.currentTarget.setAttribute('aria-pressed',String(stacked));event.currentTarget.textContent=stacked?'切换左右排列':'切换上下排列';});update();
</script></body></html>
