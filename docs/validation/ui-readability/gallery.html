<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PortBridge 全界面可读性对照</title>
<style>
:root{color-scheme:dark;background:#101416;color:#e5edee;font:16px/1.6 system-ui,'Microsoft YaHei UI',sans-serif}body{margin:24px}h1{font-size:26px;margin:0 0 8px}p{color:#b5c4cb;max-width:1100px}label{display:inline-flex;gap:10px;align-items:center;margin:8px 24px 12px 0}select,button{font:inherit;padding:8px 12px;border:1px solid #536b75;border-radius:5px;background:#171c1f;color:#e5edee}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;padding:12px;background:#171c1f;border:1px solid #536b75;border-radius:6px}figcaption{margin:0 0 10px;color:#b5c4cb}a{color:#85dec4}img{display:block;width:100%;height:auto;cursor:zoom-in}figure.single{grid-column:1/-1;max-width:1300px}small{display:block;color:#b5c4cb;margin-top:8px}@media(max-width:1000px){main{grid-template-columns:1fr}body{margin:16px}}
</style>
<h1>PortBridge 全界面字号与深浅主题修正</h1>
<p>正文16逻辑px、辅助文字至少14逻辑px；输入框占位颜色、表头、历史列、字节详情、工作流和弹窗同步调整。点击图片查看原图。原生Qt Windows截图的软件缩放因子与实际DPR见测试日志，不代表所有物理屏幕认证。</p>
<label>页面<select id="page"><option value="workspace">通信调试</option><option value="http">HTTP</option><option value="websocket">WebSocket</option><option value="workflow">工作流</option><option value="commands">命令库</option><option value="captures">采集文件</option><option value="settings-0">设置 · 当前环境</option><option value="settings-1">设置 · 项目与变量</option><option value="settings-2">设置 · 公共认证</option><option value="settings-3">设置 · 生效变量</option><option value="settings-4">设置 · 浏览器指纹</option><option value="http-401">真实HTTP 401响应</option><option value="ws-messages">真实WS消息</option><option value="http-body">工作流真实HTTP结果</option><option value="create-4">创建HTTP请求</option><option value="create-5">创建WS连接</option></select></label>
<label>主题<select id="theme"><option value="dark">深色</option><option value="light">浅色</option></select></label>
<label>软件缩放因子<select id="scale"><option>1</option><option>1.25</option><option>1.5</option></select></label>
<label>布局<select id="size"><option value="1440x1000">桌面</option><option value="compact">紧凑</option></select></label>
<main><figure id="old"><figcaption>基线 · 已发布87d5fd4</figcaption><a id="oldlink" target="_blank"><img id="before" alt="基线原生界面"></a><small>基线仅为六大页面桌面布局。图片按容器宽度展示，实际字号与DPR以构建/测试记录为准。</small></figure><figure id="new"><figcaption id="caption">修正后的界面</figcaption><a id="newlink" target="_blank"><img id="after" alt="修正后的原生界面"></a><small>紧凑通信窗口收起大号统计区，为收发记录和编辑区留出空间。设置内容可滚动，保存/取消按钮保留在固定底部。</small></figure></main>
<p><a href="../../reviews/ui-readability.md">审核与修正说明</a> · <a href="final/result.json">最终验证记录</a> · <a href="final/native-1/ui-results.txt">原生字体/对比度与窗口DPR日志</a></p>
<script>
const ids=['page','theme','scale','size'];function show(){const page=document.querySelector('#page').value,theme=document.querySelector('#theme').value,scale=document.querySelector('#scale').value,compact=document.querySelector('#size').value==='compact';const main=['workspace','http','websocket','workflow','commands','captures'].includes(page);let filename;if(main){const size=compact?(['http','websocket','workflow'].includes(page)?'1024x768':'1100x760'):'1440x1000';filename=`${page}-${theme}-${size}.png`;}else if(page.startsWith('settings-')){const index=page.split('-')[1];filename=compact&&[0,2,4].includes(Number(index))?`compact-${theme}-${index}.png`:`settings-${theme}-${index}.png`;}else filename=`${page}-${theme}.png`;const src=`final/native-${scale}/${filename}`;document.querySelector('#after').src=src;document.querySelector('#newlink').href=src;document.querySelector('#old').hidden=!main||compact;document.querySelector('#new').classList.toggle('single',!main||compact);if(main){document.querySelector('#before').src=`before/${page}-${theme}.png`;document.querySelector('#oldlink').href=`before/${page}-${theme}.png`;}document.querySelector('#caption').textContent=`修正后 · ${theme==='dark'?'深色':'浅色'} · 软件因子${scale}${compact?' · 紧凑':' · 桌面'}`;}ids.forEach(id=>document.querySelector('#'+id).addEventListener('change',show));show();
</script></html>
